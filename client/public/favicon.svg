<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="goldShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C68F" />
      <stop offset="50%" stop-color="#F0B87A" />
      <stop offset="100%" stop-color="#C49156" />
    </linearGradient>
    <linearGradient id="goldSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1DE" />
      <stop offset="100%" stop-color="#E2A664" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F0B87A" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Outer Shield Silhouette in Luxury Gold -->
  <path
    d="M24 4L7 11V22.5C7 32.5 14.3 41.8 24 44C33.7 41.8 41 32.5 41 22.5V11L24 4Z"
    fill="url(#goldShieldGrad)"
    filter="url(#goldGlow)"
  />
  
  <!-- Inner Contrast Shield in Dark Wine Espresso -->
  <path
    d="M24 7.5L10 13.5V22.5C10 30.8 16 38.6 24 40.5C32 38.6 38 30.8 38 22.5V13.5L24 7.5Z"
    fill="#140705"
    opacity="0.95"
  />

  <!-- Tech Code Brackets in Amber Gold -->
  <path
    d="M19 19L15 24L19 29"
    stroke="#F0B87A"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M29 19L33 24L29 29"
    stroke="#F0B87A"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Central Diamond / Spark -->
  <polygon
    points="24,19 26.5,24 24,29 21.5,24"
    fill="url(#goldSparkGrad)"
  />
</svg>